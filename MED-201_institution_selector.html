<!-- MED-201: Institution Dropdown Form Component -->
<!-- Owner: Cyril Szekiel Costes -->
<div class="form-group">
  <label for="institution">Select Institution / Clinic *</label>
  <select id="institution" name="institution" required>
    <option value="">-- Select a Medical or Dental Clinic --</option>
    <option value="montreal-medical">Montreal Medical Clinic</option>
    <option value="downtown-dental">Downtown Dental Center</option>
    <option value="st-laurent-health">St. Laurent Community Health</option>
    <option value="east-end-pediatrics">East End Pediatrics</option>
  </select>
  <span class="error-msg" id="err-institution">Please select a clinic.</span>
</div>
