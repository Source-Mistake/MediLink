<!-- MED-202: Client Personal Info Form Fields -->
<!-- Owner: Cyril Szekiel Costes -->
<div class="form-row">
  <div class="form-group">
    <label for="age">Age *</label>
    <input type="number" id="age" name="age" min="1" max="120" placeholder="e.g. 28" required>
    <span class="error-msg" id="err-age">Age must be between 1 and 120.</span>
  </div>

  <div class="form-group">
    <label for="gender">Gender *</label>
    <select id="gender" name="gender" required>
      <option value="">-- Select --</option>
      <option value="Female">Female</option>
      <option value="Male">Male</option>
      <option value="Non-binary">Non-binary</option>
      <option value="Prefer not to say">Prefer not to say</option>
    </select>
    <span class="error-msg" id="err-gender">Please select a gender.</span>
  </div>
</div>

<div class="form-row">
  <div class="form-group">
    <label for="weight">Weight (kg) *</label>
    <input type="number" id="weight" name="weight" min="1" max="300" step="0.1" placeholder="e.g. 70" required>
    <span class="error-msg" id="err-weight">Weight must be positive (1-300 kg).</span>
  </div>

  <div class="form-group">
    <label for="height">Height (cm) *</label>
    <input type="number" id="height" name="height" min="30" max="250" placeholder="e.g. 175" required>
    <span class="error-msg" id="err-height">Height must be positive (30-250 cm).</span>
  </div>
</div>
